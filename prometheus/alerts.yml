groups:
  - name: infrawatch-host
    rules:
      - alert: HighCpuUsage
        expr: 100 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage has been above 90% for more than 5 minutes (current value: {{ printf \"%.1f\" $value }}%)."

      - alert: HighMemoryUsage
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage has been above 90% for more than 5 minutes (current value: {{ printf \"%.1f\" $value }}%)."

      - alert: RootDiskUsageHigh
        expr: |
          100 * (1 - node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay|squashfs|ramfs|devtmpfs|fuse.*"}
                   / node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay|squashfs|ramfs|devtmpfs|fuse.*"}) > 85
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Root filesystem almost full on {{ $labels.instance }}"
          description: "Disk usage of / has been above 85% for more than 5 minutes (current value: {{ printf \"%.1f\" $value }}%)."

      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Target {{ $labels.job }} is down"
          description: "Prometheus could not scrape {{ $labels.instance }} (job {{ $labels.job }}) for more than 1 minute."
