        eval_time: 5m
        exp_samples: []
      - expr: ALERTS{alertname="TargetDown"}
        eval_time: 20m
        exp_samples: []

  # TargetDown: outage -> pending on first failed evaluation, firing after 1m, cleared after recovery
  - interval: 1m
    input_series:
      - series: 'up{instance="localhost:9101", job="demo-service"}'
        values: '1x1 0x10 1x15'
    alert_rule_test:
      - eval_time: 1m
        alertname: TargetDown
        exp_alerts: []
      - eval_time: 2m
        alertname: TargetDown
        exp_alerts: []
      - eval_time: 3m
        alertname: TargetDown
        exp_alerts:
          - exp_labels:
              instance: localhost:9101
              job: demo-service
              severity: critical
            exp_annotations:
              summary: "Target demo-service is down"
              description: "Prometheus could not scrape localhost:9101 (job demo-service) for more than 1 minute."
      - eval_time: 12m
        alertname: TargetDown
        exp_alerts:
          - exp_labels:
              instance: localhost:9101
              job: demo-service
              severity: critical
            exp_annotations:
              summary: "Target demo-service is down"
              description: "Prometheus could not scrape localhost:9101 (job demo-service) for more than 1 minute."
      - eval_time: 13m
        alertname: TargetDown
        exp_alerts: []
      - eval_time: 20m
        alertname: TargetDown
        exp_alerts: []
    promql_expr_test:
      - expr: ALERTS{alertname="TargetDown"}
        eval_time: 1m
        exp_samples: []
      - expr: ALERTS{alertname="TargetDown"}
        eval_time: 2m
        exp_samples:
          - labels: 'ALERTS{alertname="TargetDown", alertstate="pending", instance="localhost:9101", job="demo-service", severity="critical"}'
            value: 1
      - expr: ALERTS{alertname="TargetDown"}
        eval_time: 3m
        exp_samples:
          - labels: 'ALERTS{alertname="TargetDown", alertstate="firing", instance="localhost:9101", job="demo-service", severity="critical"}'
            value: 1
      - expr: ALERTS{alertname="TargetDown"}
        eval_time: 12m
        exp_samples:
          - labels: 'ALERTS{alertname="TargetDown", alertstate="firing", instance="localhost:9101", job="demo-service", severity="critical"}'
            value: 1
      - expr: ALERTS{alertname="TargetDown"}
        eval_time: 13m
        exp_samples: []
      - expr: ALERTS{alertname="TargetDown"}
        eval_time: 20m
        exp_samples: []

  # TargetDown: a single failed scrape shorter than `for` never fires
  - interval: 1m
    input_series:
      - series: 'up{instance="localhost:9101", job="demo-service"}'
        values: '1x1 0x0 1x20'
    alert_rule_test:
