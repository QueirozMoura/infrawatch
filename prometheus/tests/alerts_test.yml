        eval_time: 10m
        exp_samples: []
      - expr: ALERTS{alertname="RootDiskUsageHigh"}
        eval_time: 30m
        exp_samples: []

  # TargetDown: healthy target never alerts
  - interval: 1m
    input_series:
      - series: 'up{instance="localhost:9101", job="demo-service"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: TargetDown
        exp_alerts: []
      - eval_time: 20m
        alertname: TargetDown
        exp_alerts: []
    promql_expr_test:
