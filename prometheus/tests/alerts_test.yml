    promql_expr_test:
      - expr: ALERTS{alertname="RootDiskUsageHigh"}
        eval_time: 0m
        exp_samples:
          - labels: 'ALERTS{alertname="RootDiskUsageHigh", alertstate="pending", device="/dev/sda3", fstype="btrfs", instance="localhost:9100", job="node-exporter", mountpoint="/", severity="critical"}'
            value: 1
      - expr: ALERTS{alertname="RootDiskUsageHigh"}
        eval_time: 5m
        exp_samples:
