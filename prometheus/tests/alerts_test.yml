        alertname: HighCpuUsage
        exp_alerts: []
      - eval_time: 6m
        alertname: HighCpuUsage
        exp_alerts: []
      - eval_time: 7m
        alertname: HighCpuUsage
        exp_alerts: []
      - eval_time: 20m
        alertname: HighCpuUsage
        exp_alerts: []
    promql_expr_test:
