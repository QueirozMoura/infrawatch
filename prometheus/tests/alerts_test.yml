            value: 1

  # RootDiskUsageHigh: only the root mountpoint counts - a full /home or a tmpfs on / is ignored
  - interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{device="/dev/sda3", fstype="btrfs", instance="localhost:9100", job="node-exporter", mountpoint="/"}'
