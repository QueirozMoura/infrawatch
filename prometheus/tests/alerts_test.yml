# Unit tests for prometheus/alerts.yml (promtool test rules).
# All series below are synthetic and exist only inside these tests.
# Run with: scripts/test-alerts.sh
#
# Notes
# - promtool only lists FIRING alerts in `alert_rule_test`; to assert the
#   `pending` state we query the synthetic ALERTS series with promql_expr_test.
# - Group evaluation interval is 1m, so `for: 5m` fires 5 evaluations after the
#   first true evaluation and `for: 1m` fires on the next evaluation.
rule_files:
  - ../alerts.yml

evaluation_interval: 1m

tests:

  # HighCpuUsage: normal load (20% usage) never alerts
  - interval: 1m
    input_series:
      - series: 'node_cpu_seconds_total{cpu="0", mode="idle", instance="localhost:9100", job="node-exporter"}'
        values: '0+48x30'
      - series: 'node_cpu_seconds_total{cpu="1", mode="idle", instance="localhost:9100", job="node-exporter"}'
        values: '0+48x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: HighCpuUsage
        exp_alerts: []
      - eval_time: 20m
        alertname: HighCpuUsage
        exp_alerts: []
    promql_expr_test:
      - expr: ALERTS{alertname="HighCpuUsage"}
        eval_time: 10m
        exp_samples: []
      - expr: ALERTS{alertname="HighCpuUsage"}
        eval_time: 20m
        exp_samples: []

  # HighCpuUsage: sustained 95% usage -> pending, then firing after 5m
  - interval: 1m
    input_series:
      - series: 'node_cpu_seconds_total{cpu="0", mode="idle", instance="localhost:9100", job="node-exporter"}'
        values: '0+3x30'
      - series: 'node_cpu_seconds_total{cpu="1", mode="idle", instance="localhost:9100", job="node-exporter"}'
        values: '0+3x30'
    alert_rule_test:
      - eval_time: 1m
        alertname: HighCpuUsage
        exp_alerts: []
      - eval_time: 5m
        alertname: HighCpuUsage
        exp_alerts: []
      - eval_time: 6m
        alertname: HighCpuUsage
        exp_alerts:
          - exp_labels:
              instance: localhost:9100
              severity: warning
            exp_annotations:
              summary: "High CPU usage on localhost:9100"
              description: "CPU usage has been above 90% for more than 5 minutes (current value: 95.0%)."
    promql_expr_test:
      - expr: ALERTS{alertname="HighCpuUsage"}
        eval_time: 1m
        exp_samples:
          - labels: 'ALERTS{alertname="HighCpuUsage", alertstate="pending", instance="localhost:9100", severity="warning"}'
            value: 1
      - expr: ALERTS{alertname="HighCpuUsage"}
        eval_time: 5m
        exp_samples:
          - labels: 'ALERTS{alertname="HighCpuUsage", alertstate="pending", instance="localhost:9100", severity="warning"}'
            value: 1
      - expr: ALERTS{alertname="HighCpuUsage"}
        eval_time: 6m
        exp_samples:
          - labels: 'ALERTS{alertname="HighCpuUsage", alertstate="firing", instance="localhost:9100", severity="warning"}'
            value: 1

  # HighCpuUsage: recovery - firing at 95%, clears once usage returns to normal
  - interval: 1m
    input_series:
      - series: 'node_cpu_seconds_total{cpu="0", mode="idle", instance="localhost:9100", job="node-exporter"}'
        values: '0+3x10 33+48x30'
      - series: 'node_cpu_seconds_total{cpu="1", mode="idle", instance="localhost:9100", job="node-exporter"}'
        values: '0+3x10 33+48x30'
    alert_rule_test:
      - eval_time: 6m
        alertname: HighCpuUsage
        exp_alerts:
          - exp_labels:
              instance: localhost:9100
              severity: warning
            exp_annotations:
              summary: "High CPU usage on localhost:9100"
              description: "CPU usage has been above 90% for more than 5 minutes (current value: 95.0%)."
      - eval_time: 10m
        alertname: HighCpuUsage
        exp_alerts:
          - exp_labels:
              instance: localhost:9100
              severity: warning
            exp_annotations:
              summary: "High CPU usage on localhost:9100"
              description: "CPU usage has been above 90% for more than 5 minutes (current value: 95.0%)."
      - eval_time: 25m
        alertname: HighCpuUsage
        exp_alerts: []
    promql_expr_test:
      - expr: ALERTS{alertname="HighCpuUsage"}
        eval_time: 6m
        exp_samples:
          - labels: 'ALERTS{alertname="HighCpuUsage", alertstate="firing", instance="localhost:9100", severity="warning"}'
            value: 1
      - expr: ALERTS{alertname="HighCpuUsage"}
        eval_time: 10m
        exp_samples:
          - labels: 'ALERTS{alertname="HighCpuUsage", alertstate="firing", instance="localhost:9100", severity="warning"}'
            value: 1
      - expr: ALERTS{alertname="HighCpuUsage"}
        eval_time: 25m
        exp_samples: []

  # HighCpuUsage: 3-minute spike shorter than `for` never fires
  - interval: 1m
    input_series:
      - series: 'node_cpu_seconds_total{cpu="0", mode="idle", instance="localhost:9100", job="node-exporter"}'
        values: '0+3x3 9+48x30'
      - series: 'node_cpu_seconds_total{cpu="1", mode="idle", instance="localhost:9100", job="node-exporter"}'
