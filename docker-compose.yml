name: infrawatch

# Both services use the host network namespace and listen ONLY on 127.0.0.1,
# so nothing is reachable from outside this machine. No `ports:` are published.

services:
  prometheus:
    image: docker.io/prom/prometheus:v3.5.0
    container_name: infrawatch-prometheus
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=127.0.0.1:9090
    volumes:
      # `z` relabels only this single config file (not the host root).
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - prometheus_data:/prometheus
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - node-exporter

  node-exporter:
    image: docker.io/prom/node-exporter:v1.9.1
    container_name: infrawatch-node-exporter
    network_mode: host
    # Host PID namespace so process/CPU metrics reflect the host.
    pid: host
    command:
      - --web.listen-address=127.0.0.1:9100
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/credentials/.+|var/lib/(docker|containers)/.+)($$|/)
    volumes:
      # Read-only host root. Deliberately NO `z`/`Z`: relabeling `/` would
      # change SELinux labels across the whole host filesystem.
      - /:/host:ro,rslave
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  grafana:
    image: docker.io/grafana/grafana:12.2.0
    container_name: infrawatch-grafana
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_SECURITY_ADMIN_USER: admin
      # Defined in the untracked .env file (see .env.example); never committed.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      # `z` relabels only the provisioning directory of this project.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./grafana/dashboards:/etc/grafana/dashboards:ro,z
      - grafana_data:/var/lib/grafana
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  prometheus_data:
  grafana_data:
